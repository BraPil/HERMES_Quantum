analysis_settings:
  # Data collection settings
  data_sources:
    - "financial_statements"
    - "market_data"
    - "news_sentiment"
    - "social_media"
    - "insider_trading"
    - "analyst_ratings"
  
  # Time windows for analysis
  time_windows:
    short_term: "1M"
    medium_term: "3M"
    long_term: "1Y"
  
  # Agent coordination settings
  orchestration:
    enable_parallel_analysis: true
    aggregate_insights: true
    conflict_resolution: "weighted_consensus"
  
  # Output preferences
  output:
    format: ["json", "report"]
    visualization: true
    save_to_database: true
