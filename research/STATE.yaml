        - "pandas_ta (115+ technical indicators)"
        - "empyrical-reloaded (risk metrics)"
        - "alphalens-reloaded (factor validation)"
        - "yfinance + Quandl (data sources)"
  insights:
    - "ProsusAI/finbert is industry standard with 69.6M downloads"
    - "yiyanghkust/finbert-tone has massive 4.9B token pre-training, ideal for analyst reports"
    - "Different FinBERT models have different label mappings - requires careful handling"
    - "FinTwitBERT-sentiment is ONLY model trained on financial tweets (10M+1.47M tweets)"
    - "FinTwitBERT handles emojis, $cashtags, informal language - perfect for 23_social"
    - "Three complementary models: ProsusAI (news), yiyanghkust (analyst), FinTwitBERT (social)"
    - "Chronos-T5-Large: First major foundation model for time series forecasting"
    - "Chronos treats time series as language - breakthrough zero-shot forecasting"
    - "Chronos-Bolt (v2) available: 5% lower error, 250x faster, 20x memory efficient"
    - "BART-large-mnli: Zero-shot classification with 132.7M downloads - no training needed"
    - "BART enables flexible news categorization - define categories at inference time"
    - "Complete agent coverage: 22_psychology, 23_social, 24_politics, 25_market all have models"
    - "mrm8488/distilroberta-finetuned-financial is faster alternative (82M params vs 110M)"
  agent_refinements_needed:
    - "22_psychology should use ProsusAI/finbert for formal financial news"
    - "23_social should use FinTwitBERT-sentiment for Twitter/social media"

